# W2 TG-Analyst sozlamasi (W2 o'zi boshqaradi; o'qish: load_config("w2-tg-analyst") -> cfg["app"]). Sir yo'q.

[segmenter]
# W2-04: suhbatni bo'laklash (qoida asosida, LLM'siz). Qoidalar: SEGMENTER.md.
# Qiymat o'zgarsa `version` ham oshirilsin (eski episodlar eski versiya bilan qoladi).
version = "w2-seg-v1"
gap_minutes = 30              # R4: oldingi xabardan shuncha daqiqa ichida -> shu episod
extended_gap_minutes = 60     # R5: shu oraliqda suhbatdosh qaytsa yoki hodim mijozga javob bersa -> shu episod
reply_window_hours = 12       # R3: reply shu muddat ichida bo'lsa asl xabarning episodiga qo'shiladi (bir kun ichida)
max_episode_hours = 6         # R6: episod bundan uzun bo'lmaydi (reply bundan mustasno)
max_messages = 200            # R6: episodda eng ko'pi bilan shuncha xabar (LLM konteksti uchun)
db_role = "w2_analyst"
