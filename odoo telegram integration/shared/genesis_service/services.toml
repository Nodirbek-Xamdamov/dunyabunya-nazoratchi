# W0 services (W0-07). One [services.<name>] = Task Scheduler task genesis_<name> + runner.
# Keys and placeholders: shared/genesis_service/config.py, how-to: shared/SERVICES.md.
# Other windows keep their own file in their folder and pass --config (W0 does not register them).

[defaults]
autostart = true
restart_delay_s = 5
max_backoff_s = 120
reset_after_s = 300
stop_timeout_s = 30
log_max_mb = 20
log_keep = 5

[services.ollama]
description = "Ollama server (Gemma 4 12B), faqat 127.0.0.1:11434; tray ilovasiz, shuning uchun o'zi yangilanmaydi"
command = ['C:\Users\Администратор\AppData\Local\Programs\Ollama\ollama.exe', 'serve']
cwd = 'C:\Users\Администратор\AppData\Local\Programs\Ollama'
env = { OLLAMA_HOST = "127.0.0.1:11434", OLLAMA_MODELS = 'C:\Users\Администратор\.ollama\models' }
stop_timeout_s = 5       # Ollama has no stop signal here: the tree is ended after 5 s

[services.gpu_gate]
description = "GPU gate (W0-06, D-30): timeslice/coresident/dedicated, model yuklash/bo'shatish, ruxsat e'loni"
command = ['{python}', '-E', '-m', 'genesis_gpu', 'run', '--interval', '15']
cwd = '{root}'
stop_timeout_s = 30      # the gate checks GENESIS_STOP_FILE every second and exits by itself


[services.scheduler]
description = "W0-08 scheduler: signallar (core.alerts), daily_close, camera_day_batch 22:10, partitionlar, retention (dry-run)"
command = ['{python}', '-E', '-m', 'genesis_ops', 'run', '--interval', '30']
cwd = '{root}'
stop_timeout_s = 30      # the scheduler checks GENESIS_STOP_FILE every second and exits by itself
