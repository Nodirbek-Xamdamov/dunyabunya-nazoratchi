# Throwaway services for run_service_tests.py (registered, broken on purpose, then removed).
[services.svctest_long]
description = "W0-07 sinov: uzoq ishlaydi, nevara jarayon bilan"
command = ['{python}', '-E', '{root}\shared\genesis_service\tests\dummy_service.py']
env = { DUMMY_PID_FILE = '{root}\var\run\services\svctest_long.pids' }
