# W3 dashboard settings (no secrets here). Read with genesis_common.load_config("w3-dashboard") -> cfg["app"].
# The database password comes from secrets/postgres.env (W3_DASHBOARD_PASSWORD) through the shared loader.
# Any key can be overridden by an OS environment variable W3_<KEY> (for example W3_DATABASE=genesis).

[db]
database = "genesis_test"        # W3-02: test database with W0 fixtures; the real one is "genesis"
role = "w3_dashboard"            # read-only role, only api.* views (SCHEMA.md §3, §10)
query_timeout_seconds = 10
result_limit = 1000              # rows per page in lists
feed_limit = 300

[server]
host = "127.0.0.1"               # D-15: local only
port = 8503                      # 8501 and 8502 are taken (8502 = the running prototype)
password = ""                    # old single password (unused since W3-05: logins in core.dashboard_users)

[dashboard]
report_time = "00:00"            # D-05: the day closes at 00:00
sla_minutes = 5
work_hours = "09:00-19:00"
cache_ttl_open = 60
cache_ttl_closed = 600
silent_days = 7
freshness_yellow_minutes = 120
freshness_red_minutes = 720
pending_stale_minutes = 30
state_db = "data/state.db"       # the dashboard's own layout file (SQLite), never the Genesis database
access_log = "logs/access.jsonl" # W3-05: who saw what (until W0 adds a function for core.audit_log)
reports_dir = 'D:\Demos\odoo telegram integration\var\w3-dashboard\reports'

[camera]                         # W3-04 (D-31): event frames shown next to arrival/departure
frames_dir = 'E:\data\camera_events'   # real frames (W4-05 writes them, D-29); used only with database = "genesis"
fixture_frames_dir = 'D:\Demos\odoo telegram integration\var\w3-dashboard\fixture_frames'  # synthetic, genesis_test (scripts\make_fixture_frames.py)
show_frames = true               # frames only for users with camera_access (W3-05); false hides them for everybody

[risk]
w_missed = 0.35
w_rate = 0.25
w_growth = 0.20
w_slow = 0.20
cap_missed = 5
cap_rate = 0.4
cap_growth = 1.0
cap_slow_minutes = 30
min_related = 3
red = 70
yellow = 40
