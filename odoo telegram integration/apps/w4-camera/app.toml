# W4 Camera sozlamasi (W4 o'zi boshqaradi; o'qish: load_config("w4-camera") -> cfg["app"]).
# Sir yo'q: kamera manzili faqat secrets/camera1.txt da.
# Yo'llar bo'sh joyli: bitta qo'shtirnoqli (literal) satr, '\' qochirilmaydi.

[recorder]
camera_id = "camera1"
secret = "camera1.txt"                  # secrets/ ichidagi fayl nomi
channel = 102                           # D-20: 102 oqim o'z holida (H.265 640x360 20 fps), -c copy
window = "07:00-22:00"                  # yozish soatlari, [project].timezone bo'yicha; chegarada bo'lak kesiladi
utc_offset = "+05:00"                   # tzdata bo'lmasa (Windows Python) shu ishlatiladi; Toshkentda yozgi vaqt yo'q
segment_minutes = 10
video_root = 'E:\data\video'            # <video_root>\<camera_id>\<YYYY-MM-DD>\<UTC>.mkv (foydalanuvchi, 2026-10-26)
keep_root = 'E:\data\video_keep'        # haqiqat to'plami qirqimlari: aylanma bufer bu papkaga tegmaydi
retention_days = 14                     # aylanma bufer (vaqtincha; W4-10 da qayta ko'riladi)
stall_seconds = 60                      # oxirgi bo'lak shuncha vaqt o'smasa ffmpeg o'ldiriladi va qayta ulanadi
socket_timeout_seconds = 10
backoff_max_seconds = 60                # qayta ulanish: 1, 2, 4 ... shu songacha
warn_free_gb = 20                       # E: da bundan kam bo'sh joy -> logda ogohlantirish
stop_free_gb = 2                        # bundan kam -> yozish to'xtaydi (hech narsa o'chirilmaydi)
heartbeat_seconds = 10
state_dir = 'D:\Demos\odoo telegram integration\var\w4-camera'   # yurak urishi, lock, STOP fayli
