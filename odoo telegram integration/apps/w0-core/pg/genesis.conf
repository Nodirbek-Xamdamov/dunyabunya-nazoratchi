# Genesis PostgreSQL cluster settings (W0-03). Included from E:\pgdata\postgresql.conf.
# Source of truth: apps/w0-core/pg/genesis.conf; init_cluster.ps1 copies it into the data dir.
# Server: 64 GB RAM shared with YOLO, Ollama, the old PostgreSQL 17 and bots; data on E: (HDD).

# Connections (D-21: localhost only, port 5433)
listen_addresses = 'localhost'
port = 5433
max_connections = 100
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = '10min'   # a stuck queue worker must not hold locks

# Time (P-07: timestamptz is stored in UTC, shown in Asia/Tashkent)
timezone = 'Asia/Tashkent'
log_timezone = 'Asia/Tashkent'
lc_messages = 'C'

# Memory
shared_buffers = 4GB              # Windows: large shared_buffers bring little, OS cache does the rest
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 1GB
autovacuum_work_mem = 512MB
huge_pages = off                  # needs the "Lock pages in memory" right on Windows
wal_buffers = 64MB

# Disk: HDD
random_page_cost = 4.0
seq_page_cost = 1.0
effective_io_concurrency = 0      # must be 0 on Windows (no posix_fadvise)
maintenance_io_concurrency = 0

# WAL and checkpoints. D-22: pg_wal is a junction to D:\pgwal (NVMe, ~1140 flushes/s);
# data stays on E: (HDD: real fsync ~77/s, its open_datasync ~3400/s comes from the drive's
# volatile write cache). On D: all methods are equal; fsync is kept as the honest one.
wal_sync_method = fsync
wal_compression = lz4
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# CPU: i7-14700K, 28 threads (shared)
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
jit = off

# Logging (inside the data dir: E:\pgdata\log)
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
