# Streamlit settings of the dashboard (run_dashboard.ps1 starts Streamlit from the dashboard folder,
# so this file is used). Address/port can be overridden from dashboard\.env (DASHBOARD_HOST/PORT).
# The design is fixed: the [theme] part below (the chat's design agent was removed on 2026-10-22).
# With fileWatcherType = "none" no file is watched.

[server]
headless = true
address = "127.0.0.1"
port = 8502
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[logger]
level = "warning"

[theme]
baseRadius = "0.75rem"

[theme.light]
primaryColor = "#4F46E5"
chartCategoricalColors = ["#4F46E5", "#EA580C", "#16A34A", "#DC2626", "#94A3B8", "#0EA5E9", "#A855F7", "#EAB308"]

[theme.dark]
primaryColor = "#818CF8"
chartCategoricalColors = ["#818CF8", "#FB923C", "#4ADE80", "#F87171", "#94A3B8", "#38BDF8", "#C084FC", "#FACC15"]
