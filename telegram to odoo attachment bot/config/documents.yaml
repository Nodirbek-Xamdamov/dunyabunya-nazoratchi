# Hujjat turlari. Bot rasmdagi QR/shtrix-kod matnini, PDF matnini yoki AI o'qigan hujjat raqamini
# shu ro'yxat bo'yicha Odoo yozuviga bog'laydi va faylni o'sha yozuvning chatter'iga biriktiradi.
# Yangi bo'lim qo'shish = shu yerga yangi blok (kod o'zgarmaydi).
#
#   key            ichki nom (kichik harf, raqam, _)
#   title          odamga ko'rsatiladigan nom
#   model          Odoo modeli
#   number         hujjat raqamining ko'rinishi (regex, butun matnga). AI o'qigan va odam yozgan raqam shu bilan tanladi
#   codes          QR/shtrix-kod matni uchun regex'lar. Nomlangan guruhlar:
#                    (?P<id>...) + ixtiyoriy (?P<token>...)  -> yozuv id bo'yicha, token `token_field` bilan solishtiriladi
#                    (?P<name>...)                          -> yozuv nomi (`name`) bo'yicha
#   hint           AI uchun: hujjat qog'ozda qanday ko'rinadi
#   partner_field, total_field, person_field
#                  AI yo'lida tekshiruv: AI o'qigan xaridor / summa / mas'ul shaxs shu maydonlar bilan solishtiriladi
#                  (telefon xaridorning phone/mobile maydonlari bilan). Hech bo'lmasa bittasi mos, hech biri zid emas
#                  bo'lsa avtomatik biriktiriladi; aks holda bot yuboruvchidan so'raydi.

documents:
  - key: sale
    title: Sotuv buyurtmasi
    model: sale.order
    number: 'S\d{5,}'
    codes:
      - '/my/orders/(?P<id>\d+)\?access_token=(?P<token>[\w-]+)'   # "Xaridordan buyurtma" QR (portal havola)
      - '^(?P<name>S\d{5,})$'                                       # "Yo'llanma" shtrix-kodi
    hint: "Sarlavha 'XARIDORDAN BUYURTMA № S82409' yoki 'Yo'llanma'; raqam S bilan boshlanadi"
    partner_field: partner_id
    total_field: amount_total
    person_field: user_id

  - key: purchase
    title: Xarid buyurtmasi
    model: purchase.order
    number: 'P\d{5,}'
    codes:
      - '/my/purchase/(?P<id>\d+)\?access_token=(?P<token>[\w-]+)'  # "Tovar kirim" QR (portal havola)
      - '^(?P<name>P\d{5,})$'
    hint: "Tovar kirim / xarid hujjati; raqam P bilan boshlanadi, masalan P32200"
    partner_field: partner_id
    total_field: amount_total
    person_field: user_id

  - key: picking
    title: Ombor hujjati
    model: stock.picking
    number: '[A-Z]{1,5}/[A-Z]{2,5}/\d{4,}'
    codes:
      - '^(?P<name>[A-Z]{1,5}/[A-Z]{2,5}/\d{4,})$'                 # "Ombor cheki" QR, "Transfer Yo'llanma" shtrix-kodi
    hint: "Ombor cheki yoki Transfer Yo'llanma; raqam masalan OD/OUT/01234, SHF/POS/00456"
    partner_field: partner_id
