<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loyiha holati</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2421;--mute:#69706b;--line:#e1ded6;--accent:#0f6e56;--done:#2f8f4e;--doing:#c9861a;--block:#c23b3b;--lock:#9a9f9b}
@media (prefers-color-scheme:dark){:root{--bg:#161a18;--card:#1f2522;--ink:#e8ebe9;--mute:#9aa39e;--line:#2f3733;--accent:#4cc9a0;--done:#58b977;--doing:#e0a33a;--block:#e06a6a;--lock:#6d7570}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
h2{font-size:16px;margin:32px 0 12px;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.chip{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;margin-left:6px;vertical-align:middle}
.chip.frozen{color:var(--done);border-color:var(--done)}
.chip.draft{color:var(--doing);border-color:var(--doing)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.top{display:grid;gap:10px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.card .path{color:var(--mute);font-size:12px;margin:2px 0 8px;font-family:ui-monospace,Consolas,monospace}
.next{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0}
.next b{font-weight:600}
.step{display:flex;gap:8px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line);font-size:13.5px}
.step:first-of-type{border-top:0}
.dot{flex:none;width:11px;height:11px;border-radius:50%;margin-top:5px;border:2px solid var(--lock)}
.dot.done{background:var(--done);border-color:var(--done)}
.dot.doing{background:var(--doing);border-color:var(--doing)}
.dot.blocked{background:var(--block);border-color:var(--block)}
.dot.locked{border-style:dashed}
.dot.todo{border-color:var(--mute)}
.step .id{color:var(--mute);font-family:ui-monospace,Consolas,monospace;font-size:12px;flex:none;width:50px;margin-top:1px}
.step .note{display:block;color:var(--mute);font-size:12.5px}
.tag{font-size:11.5px;color:var(--mute)}
.ms{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.log{font-size:13.5px}
.log div{padding:6px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}
.log .t{color:var(--mute);font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-right:8px}
label.f{font-size:13px;color:var(--mute);cursor:pointer}
.err{border:1px solid var(--block);color:var(--block);padding:14px;border-radius:10px}
a{color:var(--accent)}
</style>
</head>
<body>
<main id="app"></main>
<script src="state.js"></script>
<script>
(function(){
var app=document.getElementById('app');
var S=window.GENESIS_STATE;
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
if(!S||!S.windows){
  var er=el('div','err','state.js yuklanmadi yoki buzilgan (JSON xato). Oxirgi o\'zgarishni tekshiring.');
  app.appendChild(er);return;
}
var LABEL={todo:'Navbatda',doing:'Jarayonda',done:'Tayyor',blocked:'Savol kutilmoqda',locked:'Qulflangan'};
var byId={};
S.windows.forEach(function(w){w.steps.forEach(function(s){byId[s.id]=s;});});
function isDone(id){return byId[id]&&byId[id].s==='done';}
function needsOf(w,s){return s.needs||w.needs||[];}
function waiting(w,s){return needsOf(w,s).filter(function(id){return !isDone(id);});}
function eff(w,s){if(s.s!=='todo')return s.s;return waiting(w,s).length?'locked':'todo';}
function counts(w){var d=0;w.steps.forEach(function(s){if(s.s==='done')d++;});return d;}
function bar(p){var b=el('div','bar');var i=el('i');i.style.width=Math.round(p*100)+'%';b.appendChild(i);return b;}
function nextStep(w){for(var i=0;i<w.steps.length;i++){if(w.steps[i].s!=='done')return w.steps[i];}return null;}

var total=0,done=0;
S.windows.forEach(function(w){total+=w.steps.length;done+=counts(w);});

var head=el('header');
var h1=el('h1',null,S.meta.project);
var ch=el('span','chip '+(S.meta.plan_status==='FROZEN'?'frozen':'draft'),'Reja v'+S.meta.plan_version+' · '+S.meta.plan_status);
h1.appendChild(ch);
head.appendChild(h1);
head.appendChild(el('div','sub','Oxirgi yangilanish: '+S.meta.updated+' · umumiy: '+done+' / '+total+' qadam'));
var top=el('div','top');top.appendChild(bar(total?done/total:0));head.appendChild(top);
app.appendChild(head);

app.appendChild(el('h2',null,'Qayerdan davom etish'));
var g1=el('div','grid');
S.windows.forEach(function(w){
  var c=el('div','card');
  var h=el('h3');h.appendChild(el('span',null,w.id+' '+w.name));h.appendChild(el('span','tag',counts(w)+' / '+w.steps.length));
  c.appendChild(h);c.appendChild(el('div','path',w.folder));
  var n=nextStep(w);
  if(!n){c.appendChild(el('div','next','Hamma qadam tayyor.'));}
  else{
    var st=eff(w,n);var box=el('div','next');
    var b=el('b',null,n.id+'  '+n.t);box.appendChild(b);
    var line=el('div','tag',LABEL[st]);
    if(st==='locked'){line.textContent=LABEL[st]+': kutilmoqda '+waiting(w,n).join(', ');}
    box.appendChild(line);
    if(n.n){box.appendChild(el('div','tag',n.n));}
    c.appendChild(box);
  }
  c.appendChild(bar(counts(w)/w.steps.length));
  g1.appendChild(c);
});
app.appendChild(g1);

var hd=el('h2',null,'Barcha qadamlar ');
var lab=el('label','f');var cb=document.createElement('input');cb.type='checkbox';cb.id='onlyOpen';
lab.appendChild(cb);lab.appendChild(document.createTextNode(' faqat tugamaganlar'));hd.appendChild(lab);
app.appendChild(hd);
var g2=el('div','grid');
S.windows.forEach(function(w){
  var c=el('div','card');
  var h=el('h3');h.appendChild(el('span',null,w.id+' '+w.name));h.appendChild(el('span','tag',Math.round(100*counts(w)/w.steps.length)+'%'));
  c.appendChild(h);
  w.steps.forEach(function(s){
    var st=eff(w,s);
    var r=el('div','step');r.setAttribute('data-done',s.s==='done'?'1':'0');
    r.appendChild(el('span','dot '+st));
    r.appendChild(el('span','id',s.id));
    var tx=el('span');tx.appendChild(document.createTextNode(s.t));
    var tg=el('span','tag','  '+LABEL[st]);tx.appendChild(tg);
    if(st==='locked'){tx.appendChild(el('span','note','kutilmoqda: '+waiting(w,s).join(', ')));}
    if(s.n){tx.appendChild(el('span','note',s.n));}
    r.appendChild(tx);c.appendChild(r);
  });
  g2.appendChild(c);
});
app.appendChild(g2);
cb.addEventListener('change',function(){
  var rows=document.querySelectorAll('.step');
  for(var i=0;i<rows.length;i++){rows[i].style.display=(cb.checked&&rows[i].getAttribute('data-done')==='1')?'none':'';}
});

app.appendChild(el('h2',null,'Bosqichlar (milestone)'));
var mc=el('div','card');
(S.milestones||[]).forEach(function(m){
  var ok=m.needs.every(isDone);
  var r=el('div','ms');
  r.appendChild(el('span','dot '+(ok?'done':'todo')));
  var t=el('span');t.appendChild(document.createTextNode(m.id+'  '+m.t));
  t.appendChild(el('span','note tag',' '+(ok?'tayyor':'kerak: '+m.needs.filter(function(x){return !isDone(x);}).join(', '))));
  r.appendChild(t);mc.appendChild(r);
});
app.appendChild(mc);

app.appendChild(el('h2',null,'Oxirgi yozuvlar'));
var lc=el('div','card log');
(S.log||[]).slice().reverse().slice(0,30).forEach(function(l){
  var d=el('div');d.appendChild(el('span','t',l.t+' '+l.w));d.appendChild(document.createTextNode(l.x));lc.appendChild(d);
});
app.appendChild(lc);

var ft=el('p','sub');
ft.appendChild(document.createTextNode('Fayllar: '));
['README.md','QUESTIONS.md','DECISIONS.md','PLAN.md'].forEach(function(f,i){
  var a=el('a',null,f);a.href=f;a.target='_blank';ft.appendChild(a);
  if(i<3)ft.appendChild(document.createTextNode(' · '));
});
app.appendChild(ft);
})();
</script>
</body>
</html>
