[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-common"
version = "0.4.0"
description = "Shared config, secrets, logging, job queue, GPU gate and services for Genesis windows"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
packages = ["genesis_common", "genesis_queue", "genesis_gpu", "genesis_service", "genesis_ops"]
